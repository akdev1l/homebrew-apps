name: PR Check - Install Casks

on:
  pull_request:
    branches:
      - master

jobs:
  install-casks:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - cask: librewolf
            app: LibreWolf.app
          - cask: qbittorrent
            app: qBittorrent.app
          - cask: xmoto
            app: X-Moto.app
          - cask: fedora-media-writer
            app: FedoraMediaWriter.app
    steps:
      # Since this repo is named "homebrew-apps", this action auto-taps
      # akdev1l/apps from $GITHUB_SHA and symlinks it into $GITHUB_WORKSPACE
      # itself, so no separate checkout/tap step is needed (or safe to add:
      # it would collide with the tap this action already creates).
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install ${{ matrix.cask }}
        run: brew install --cask --verbose "akdev1l/apps/${{ matrix.cask }}"

      - name: Verify installation
        run: test -d "/Applications/${{ matrix.app }}"

      - name: Verify CLI
        if: matrix.cask == 'librewolf'
        run: librewolf --version
