name: PR Check - Install Casks

on:
  pull_request:
    branches:
      - master

jobs:
  install-casks:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - cask: librewolf
            app: LibreWolf.app
          - cask: qbittorrent
            app: qBittorrent.app
          - cask: xmoto
            app: X-Moto.app
          - cask: fedora-media-writer
            app: FedoraMediaWriter.app
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # Tapping from the local checkout (instead of the remote repo) means
      # the install below exercises the PR's changes, not what's published.
      - name: Tap local checkout
        run: brew tap akdev1l/apps "$GITHUB_WORKSPACE"

      - name: Install ${{ matrix.cask }}
        run: brew install --cask --verbose "akdev1l/apps/${{ matrix.cask }}"

      - name: Verify installation
        run: test -d "/Applications/${{ matrix.app }}"

      - name: Verify CLI
        if: matrix.cask == 'librewolf'
        run: librewolf --version
