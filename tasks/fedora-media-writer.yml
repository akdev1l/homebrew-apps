---
- name: "fetch latest release"
  uri:
    url: "{{ formula.release_api }}"
    return_content: true
  register: release

- name: "set version"
  set_fact:
    current_version: "{{ release.json.tag_name }}"
    arm64_sha256sum: ""
    intel_sha256sum: ""

# The arm64 build is named "...-macos-arm64-<version>.dmg"; anchoring the
# intel pattern to digits-only after "macos-" naturally excludes it.
- name: "select release assets"
  set_fact:
    arm64_asset: "{{ release.json.assets | selectattr('name', 'search', '^FedoraMediaWriter-macos-arm64-[0-9.]+\\.dmg$') | list | first | default({}) }}"
    intel_asset: "{{ release.json.assets | selectattr('name', 'search', '^FedoraMediaWriter-macos-[0-9.]+\\.dmg$') | list | first | default({}) }}"

- name: "assert both assets were published"
  assert:
    that:
      - arm64_asset.browser_download_url is defined
      - intel_asset.browser_download_url is defined
    fail_msg: "missing an arm64 or intel macOS .dmg asset in {{ release.json.tag_name }}"

- name: "set sha256sums from the asset digests"
  set_fact:
    arm64_sha256sum: "{{ arm64_asset.digest | default('', true) | regex_replace('^sha256:', '') }}"
    intel_sha256sum: "{{ intel_asset.digest | default('', true) | regex_replace('^sha256:', '') }}"

- name: "hash the arm64 dmg when the release omits a digest"
  when: not arm64_sha256sum
  block:
    - name: "download arm64 dmg"
      get_url:
        url: "{{ arm64_asset.browser_download_url }}"
        dest: "/tmp/{{ arm64_asset.name }}"
        mode: "0644"
      register: arm64_download

    - name: "checksum arm64 dmg"
      stat:
        path: "{{ arm64_download.dest }}"
        checksum_algorithm: sha256
      register: arm64_stat

    - name: "set sha256sum from the downloaded arm64 dmg"
      set_fact:
        arm64_sha256sum: "{{ arm64_stat.stat.checksum }}"

- name: "hash the intel dmg when the release omits a digest"
  when: not intel_sha256sum
  block:
    - name: "download intel dmg"
      get_url:
        url: "{{ intel_asset.browser_download_url }}"
        dest: "/tmp/{{ intel_asset.name }}"
        mode: "0644"
      register: intel_download

    - name: "checksum intel dmg"
      stat:
        path: "{{ intel_download.dest }}"
        checksum_algorithm: sha256
      register: intel_stat

    - name: "set sha256sum from the downloaded intel dmg"
      set_fact:
        intel_sha256sum: "{{ intel_stat.stat.checksum }}"

- name: "ensure cask directory exists"
  file:
    path: "{{ playbook_dir }}/{{ formula.template_src | regex_replace('\\.j2$', '') | dirname }}"
    state: directory
    mode: "0755"

- name: "render template"
  template:
    src: "{{ formula.template_src }}"
    dest: "{{ playbook_dir }}/{{ formula.template_src | regex_replace('\\.j2$', '') }}"
  vars:
    release_version: "{{ current_version }}"
    release_arm64_sha256sum: "{{ arm64_sha256sum }}"
    release_intel_sha256sum: "{{ intel_sha256sum }}"
