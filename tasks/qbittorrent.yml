---
- name: "fetch latest release"
  uri:
    url: "{{ formula.release_api }}"
    return_content: true
  register: release

- name: "set version"
  set_fact:
    current_version: "{{ release.json.tag_name | regex_replace('^release-', '') }}"
    dmg_sha256sum: ""
    appimage_sha256sum: ""

# The `_lt20` variants are a separate cask, so both patterns are anchored to
# exclude them (and the detached `.asc` signatures).
- name: "select release assets"
  set_fact:
    dmg_asset: "{{ release.json.assets | selectattr('name', 'search', '^qbittorrent-[0-9.]+\\.dmg$') | list | first | default({}) }}"
    appimage_asset: "{{ release.json.assets | selectattr('name', 'search', '^qbittorrent-[0-9.]+_x86_64\\.AppImage$') | list | first | default({}) }}"

- name: "assert both assets were published"
  assert:
    that:
      - dmg_asset.browser_download_url is defined
      - appimage_asset.browser_download_url is defined
    fail_msg: "missing a .dmg or x86_64 .AppImage asset in {{ release.json.tag_name }}"

- name: "set sha256sums from the asset digests"
  set_fact:
    dmg_sha256sum: "{{ dmg_asset.digest | default('', true) | regex_replace('^sha256:', '') }}"
    appimage_sha256sum: "{{ appimage_asset.digest | default('', true) | regex_replace('^sha256:', '') }}"

# Assets uploaded before GitHub started publishing digests have no `digest`
# field, so fall back to hashing the download.
- name: "hash the dmg when the release omits a digest"
  when: not dmg_sha256sum
  block:
    - name: "download dmg"
      get_url:
        url: "{{ dmg_asset.browser_download_url }}"
        dest: "/tmp/{{ dmg_asset.name }}"
        mode: "0644"
      register: dmg_download

    - name: "checksum dmg"
      stat:
        path: "{{ dmg_download.dest }}"
        checksum_algorithm: sha256
      register: dmg_stat

    - name: "set sha256sum from the downloaded dmg"
      set_fact:
        dmg_sha256sum: "{{ dmg_stat.stat.checksum }}"

- name: "hash the appimage when the release omits a digest"
  when: not appimage_sha256sum
  block:
    - name: "download appimage"
      get_url:
        url: "{{ appimage_asset.browser_download_url }}"
        dest: "/tmp/{{ appimage_asset.name }}"
        mode: "0644"
      register: appimage_download

    - name: "checksum appimage"
      stat:
        path: "{{ appimage_download.dest }}"
        checksum_algorithm: sha256
      register: appimage_stat

    - name: "set sha256sum from the downloaded appimage"
      set_fact:
        appimage_sha256sum: "{{ appimage_stat.stat.checksum }}"

- name: "ensure cask directory exists"
  file:
    path: "{{ playbook_dir }}/{{ formula.template_src | regex_replace('\\.j2$', '') | dirname }}"
    state: directory
    mode: "0755"

- name: "render template"
  template:
    src: "{{ formula.template_src }}"
    dest: "{{ playbook_dir }}/{{ formula.template_src | regex_replace('\\.j2$', '') }}"
  vars:
    release_version: "{{ current_version }}"
    release_sha256sum: "{{ dmg_sha256sum }}"
    release_appimage_sha256sum: "{{ appimage_sha256sum }}"
